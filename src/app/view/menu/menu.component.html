<button (click)="next()" style="margin-left:90%;" class="btn btn-primary" > Go TO NEXT</button>
<div class="container">
  <h2>Registered Users</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{user.password}}</td>
       
        
      </tr>
    </tbody>
  </table>
</div>
